<!DOCTYPE html>
<html>
<head>
    <title>Attendance Report</title>
</head>
<body>

<h2>Attendance Records</h2>

<table border="1" cellpadding="10">

<tr>
    <th>Student ID</th>
    <th>Name</th>
    <th>Date</th>
    <th>Time</th>
</tr>

{% for row in data %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
</tr>
{% endfor %}

</table>

<br>

<a href="/admin_dashboard">Back</a>

</body>
</html>
