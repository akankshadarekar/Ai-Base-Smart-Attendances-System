<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="login-box">

    <h2>AI Smart Attendance System</h2>

    <form action="/login" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

        <p>
            Don't have an account?
            <a href="{{ url_for('register_student') }}">
                Register Here
            </a>
        </p>

    </form>

</div>

</body>
</html>
