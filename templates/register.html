<!DOCTYPE html>
<html>
<head>
    <title>Register Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>

<div class="container">
    <div class="form-box">
        <h2>Register</h2>

        <form action="/save_student" method="POST">

            <input type="number"
                   name="id"
                   placeholder="Student ID"
                   required>

            <input type="text"
                   name="name"
                   placeholder="Student Name"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Create Password"
                   required>

            <button type="submit">
                Register Student
            </button>

        </form>

        <!-- Login Link -->
        <div class="login-link">
            Already have an account?
            <a href="/student_login">Login Here</a>
        </div>

    </div>
</div>

</body>
</html>
