<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Attendance</title>

   <link rel="stylesheet"
href="{{ url_for('static', filename='css/student_attendance.css') }}">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>My Attendance Records</h1>
        <p>Track your attendance history</p>
    </div>

    <div class="card">

        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Date</th>
                    <th>Time</th>
                </tr>
            </thead>

            <tbody>

            {% for row in data %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
                <td>{{ row[3] }}</td>
            </tr>
            {% endfor %}

            </tbody>
        </table>

    </div>

    <a href="/student_dashboard" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
