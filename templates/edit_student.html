<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            width:400px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,.3);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#2563eb;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            background:#2563eb;
            color:white;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            color:#2563eb;
        }
    </style>

</head>
<body>

<div class="box">

    <h2>Edit Student</h2>

    <form action="/update_student" method="POST">

        <input type="hidden"
               name="id"
               value="{{ student[0] }}">

        <input type="text"
               name="name"
               value="{{ student[1] }}"
               required>

        <input type="text"
               name="password"
               value="{{ student[2] }}"
               required>

        <button type="submit">
            Update Student
        </button>

    </form>

    <a href="/students" class="back">
        Back to Students
    </a>

</div>

</body>
</html>
